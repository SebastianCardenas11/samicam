<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
</head>
<body>
    <div class="container mt-4">
        <h2>Test de Tablas de Inventario</h2>
        
        <div class="row mt-4">
            <div class="col-12">
                <h4>Tabla de Impresoras</h4>
                <table class="table table-striped" id="testTable">
                    <thead>
                        <tr>
                            <th>Número</th>
                            <th>Marca</th>
                            <th>Modelo</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>001</td>
                            <td>HP</td>
                            <td>LaserJet</td>
                            <td>Bueno</td>
                        </tr>
                        <tr>
                            <td>002</td>
                            <td>Canon</td>
                            <td>Pixma</td>
                            <td>Regular</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-12">
                <h4>Test de Conexión AJAX</h4>
                <button class="btn btn-primary" onclick="testAjax()">Probar Conexión</button>
                <div id="result" class="mt-3"></div>
            </div>
        </div>
    </div>

    <script>
        const base_url = 'http://localhost/samicam';
        
        $(document).ready(function() {
            // Inicializar DataTable básica
            $('#testTable').DataTable({
                language: {
                    "processing": "Procesando...",
                    "lengthMenu": "Mostrar _MENU_ registros",
                    "zeroRecords": "No se encontraron resultados",
                    "emptyTable": "Ningún dato disponible en esta tabla",
                    "info": "Mostrando registros del _START_ al _END_ de un total de _TOTAL_ registros",
                    "infoEmpty": "Mostrando registros del 0 al 0 de un total de 0 registros",
                    "infoFiltered": "(filtrado de un total de _MAX_ registros)",
                    "search": "Buscar:",
                    "loadingRecords": "Cargando...",
                    "paginate": {
                        "first": "Primero",
                        "last": "Último",
                        "next": "Siguiente",
                        "previous": "Anterior"
                    }
                }
            });
        });
        
        function testAjax() {
            $('#result').html('<div class="spinner-border" role="status"><span class="visually-hidden">Cargando...</span></div>');
            
            $.ajax({
                url: base_url + '/Inventario/getImpresoras',
                type: 'GET',
                dataType: 'json',
                success: function(data) {
                    console.log('Respuesta exitosa:', data);
                    $('#result').html('<div class="alert alert-success">Conexión exitosa. Datos recibidos: ' + JSON.stringify(data).substring(0, 200) + '...</div>');
                },
                error: function(xhr, status, error) {
                    console.error('Error AJAX:', error, xhr.responseText);
                    $('#result').html('<div class="alert alert-danger">Error de conexión: ' + error + '<br>Respuesta: ' + xhr.responseText.substring(0, 200) + '</div>');
                }
            });
        }
    </script>
</body>
</html>
